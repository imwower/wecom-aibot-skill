[project]
name = "wecom-bot"
version = "0.2.0"
description = "企业微信智能机器人（API 模式 · 长连接）本地收发工具"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
wecom = "wecom_bot.cli:main"
wecom-daemon = "wecom_bot.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wecom_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
